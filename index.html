<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marry Me 💍</title>

<style>
body {
  margin:0;
  overflow:hidden;
  font-family:sans-serif;
  text-align:center;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  color:white;
}

h1 {
  margin-top:80px;
  font-size:28px;
}

button {
  padding:15px 25px;
  font-size:18px;
  border:none;
  border-radius:30px;
  margin:10px;
  cursor:pointer;
}

#yes {
  background:#ff3366;
  color:white;
}

#no {
  background:white;
  color:#ff3366;
}

/* yuraklar */
.heart {
  position:fixed;
  font-size:24px;
  animation:float 4s linear infinite;
}

@keyframes float {
  0% { transform:translateY(100vh);}
  100% { transform:translateY(-10vh);}
}

/* animatsiya */
#love {
  display:none;
  font-size:30px;
  margin-top:30px;
  animation:pop 1s ease;
}

@keyframes pop {
  0% { transform:scale(0);}
  100% { transform:scale(1);}
}
</style>
</head>

<body>

<h1 id="text">Shaxzoda, will you marry me? 💍</h1>

<button id="yes">YES 💖</button>
<button id="no">NO 😊</button>

<div id="love">I LOVE YOU ❤️💍</div>

<!-- romantik musiqa -->
<audio id="music" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_7b0c6a6c2e.mp3?filename=romantic-love-ambient-11077.mp3"></audio>

<script>

// ❤️ yuraklar animatsiya
setInterval(()=>{
  let h=document.createElement("div");
  h.className="heart";
  h.innerHTML="❤️";
  h.style.left=Math.random()*100+"vw";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),4000);
},300);

// 😊 NO uchun pozitiv textlar
let texts=[
  "Yana o‘ylab ko‘r 😊",
  "Baribir YES deysan 😉",
  "Men kutaman 💖",
  "Sen eng zo‘risan 😍",
  "Yuragim senga tegishli ❤️"
];

let i=0;
let no=document.getElementById("no");
let text=document.getElementById("text");

// NO bosilganda
no.onclick=()=>{
  text.innerHTML=texts[i % texts.length];
  i++;

  no.style.position="absolute";
  no.style.left=Math.random()*80+"vw";
  no.style.top=Math.random()*80+"vh";
};

// YES bosilganda
document.getElementById("yes").onclick=()=>{

  document.getElementById("music").play();
  document.getElementById("love").style.display="block";
  text.innerHTML="I LOVE YOU ❤️💍";

  // TELEGRAMGA XABAR
  fetch("https://api.telegram.org/bot8637643313:AAF6NO208binN603HQQB9JvqpvAGLaXRZGQ/sendMessage?chat_id=6258625712&text=💍 SHAXZODA YES BOSDI!!! 😍❤️🔥");
};

</script>

</body>
</html>
