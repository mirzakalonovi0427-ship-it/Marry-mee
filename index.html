<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marry Me 💍</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
  text-align: center;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
}

/* Yuraklar */
.heart {
  position: fixed;
  color: red;
  font-size: 20px;
  animation: float 5s linear infinite;
}

@keyframes float {
  0% { transform: translateY(100vh); opacity: 1; }
  100% { transform: translateY(-10vh); opacity: 0; }
}

h1 {
  margin-top: 80px;
  font-size: 28px;
  color: white;
  text-shadow: 0 0 10px #ff3366;
}

/* Tugmalar */
.buttons {
  margin-top: 40px;
}

button {
  padding: 15px 25px;
  font-size: 18px;
  border: none;
  border-radius: 30px;
  margin: 10px;
  cursor: pointer;
  transition: 0.3s;
}

#yes {
  background: #ff3366;
  color: white;
  box-shadow: 0 0 15px #ff3366;
}

#yes:hover {
  transform: scale(1.1);
}

#no {
  background: white;
  color: #ff3366;
}

/* YES bosilganda */
#love {
  display: none;
  font-size: 30px;
  color: white;
  margin-top: 50px;
  animation: pop 1s ease;
}

@keyframes pop {
  0% { transform: scale(0); }
  100% { transform: scale(1); }
}
</style>
</head>

<body>

<h1>Shaxzoda, will you marry me? 💍</h1>

<div class="buttons">
  <button id="yes">YES 💖</button>
  <button id="no">NO 😢</button>
</div>

<div id="love">I LOVE YOU SO MUCH ❤️</div>

<audio id="music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

<script>
// ❤️ yuraklar
setInterval(() => {
  let heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 5000);
}, 300);

// YES bosilganda
document.getElementById("yes").onclick = () => {
  document.getElementById("love").style.display = "block";
  document.getElementById("music").play();

  // Telegramga signal
  fetch("https://api.telegram.org/bot8637643313:AAF6NO208binN603HQQB9JvqpvAGLaXRZGQ/sendMessage?chat_id=6258625712&text=YES bosildi ❤️");
};

// NO bosilganda qochadi 😄
let no = document.getElementById("no");
no.onmouseover = () => {
  no.style.position = "absolute";
  no.style.left = Math.random() * 80 + "vw";
  no.style.top = Math.random() * 80 + "vh";
};
</script>

</body>
</html>
